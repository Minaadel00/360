<style>
:root{--navy:#14213d;--blue:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#e5e7eb;--red:#dc2626;--amber:#d97706;--green:#16a34a}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(120deg,#14213d,#243b67);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:20}
h1{margin:0;font-size:23px}.sub{opacity:.8;font-size:12px;margin-top:4px}
.toolbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:77px;z-index:19}
select,input{padding:7px 9px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;color:#344054}
button{padding:8px 12px;border:0;border-radius:7px;background:var(--navy);color:#fff;cursor:pointer}.nav{display:flex;gap:5px;overflow:auto;padding:8px 18px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:129px;z-index:18}

main{padding:16px 18px}.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px;box-shadow:0 1px 2px #00000008}.label{font-size:11px;color:var(--muted)}.value{font-size:22px;font-weight:700;margin-top:5px}.hint{font-size:10px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:12px}.panel h3{font-size:14px;margin:4px 5px 8px}.plot{height:360px}.smallplot{height:300px}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px 6px;border-bottom:1px solid #edf0f4;text-align:left}th{background:#f8fafc;position:sticky;top:0;z-index:2}.scroll{max-height:430px;overflow:auto}
.badge{padding:3px 7px;border-radius:999px;font-size:10px;font-weight:600}.p1{background:#fee2e2;color:#991b1b}.p2{background:#ffedd5;color:#9a3412}.p3{background:#fef3c7;color:#92400e}.p4{background:#dcfce7;color:#166534}
.insight{padding:9px 11px;background:#f8fafc;border-left:3px solid var(--blue);margin:6px 0;border-radius:4px;font-size:12px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.two,.three{grid-template-columns:1fr}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h1>Active DM 360 - DM Effectiveness Command Center</h1><div class="sub">District Manager performance | No data loaded | Management diagnostic view | Data as provided</div></div><a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid rgba(255,255,255,0.35);border-radius:7px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,0.08)">&#8592; Home</a></header>
<div class="toolbar">
<select id="bu"><option value="">All Business Units</option></select>

<select id="dm"><option value="">All DMs</option></select>
<select id="gov"><option value="">All Governorates</option></select>

<label style="display:flex;align-items:center;gap:6px;padding:0 4px;font-size:12px;font-weight:600">
  Load Monthly Excel
  <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" onchange="loadMonthlyExcel(this)" style="max-width:230px;padding:5px">
</label>
<span id="fileStatus" style="font-size:11px;color:#667085">No data loaded • Upload YTD Excel</span>
<div id="emptyStateNote" style="width:100%;padding:8px 12px;margin-top:4px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;font-size:11px;color:#475467">
  Dashboard is ready. Upload your monthly <b>DM YTD Excel</b> to populate the Command Center.
</div>
</div>
<div class="nav" id="nav"></div>
<main id="main"></main>

<script>
let DATA = [];
const pages = [
['p1','Executive Overview'],['p2','DM Performance Matrix'],['p3','Low Performer Command Center'],['p4','AM vs PM'],
['p5','Activity & Productivity'],['p6','Customer Quality & Master File'],['p7','Business Unit & Team Performance'],
['p8','Coaching Activity'],['p9','Tenure'],['p10','Performance Scorecard'],
['p11','Performance Risk Matrix'],['p12','Action Plan'],['p13','Setup'],['p14','Issues Brief']
];
const num=(x)=>{const n=Number(x);return x==null||x===''||!Number.isFinite(n)?null:n};
const esc=(x)=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fmtPct=x=>{const n=num(x);return n==null?'—':(n*100).toFixed(1)+'%'};
const fmtN=x=>{const n=num(x);return n==null?'—':n.toLocaleString(undefined,{maximumFractionDigits:1})};
const fmtMoney=x=>{const n=num(x);return n==null?'—':n.toLocaleString(undefined,{maximumFractionDigits:0})};

/* CONFIG holds every editable Classification / Score-weight / Priority / Potential / Gap-detection threshold.
   Adapted for DM-level data: no Working Hours, no Part-Time, no per-customer counts, no Q1/Q2 Progress
   (none of those columns exist for DMs). New: Check/Single Halves and GL Coverage feed the Coaching and
   Coverage dimensions, and every gap-detection cutoff is editable in Setup (not hard-coded) so management
   can tune "what counts as a gap" without needing another file revision. */
const DEFAULT_CONFIG = {
 classCritical:0.695, classLow:0.795, classNeeds:0.895, classStable:0.995, classGood:1.095,
 wCommercial:0.60, wActivity:0.10, wCoverage:0.05, wCustomer:0.05, wProductivity:0.05, wCoaching:0.05, wProgress:0.10,
 priorityP1Ach:0.695, priorityP1MinGaps:1, priorityP2Ach:0.795,
 potentialMinAch:0.795, potentialMaxAch:0.995,
 gapCallRateMin:0.90, gapCoverageMin:0.90, gapFreqMin:0.95, gapFreqMax:1.05,
 gapClassAMin:0.25, gapClassCMax:0.10, gapROIMin:1.00, gapMinCoachingHalves:132
};
let CONFIG = Object.assign({}, DEFAULT_CONFIG);

function v(field,r){return num(r[field])}
function vals(field){return DATA.map(r=>num(r[field])).filter(x=>x!=null)}
function pct(field,x,inverse=false){x=num(x);if(x==null)return null;let a=vals(field);if(!a.length)return null;let q=a.filter(z=>z<=x).length/a.length;return inverse?1-q:q}
function avgA(a){a=a.map(num).filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
const ratioVals=DATA.map(r=>{let s=num(r['Standard Master File']),a=num(r['Actual Master File']);return s!=null&&s>0&&a!=null?a/s:null}).filter(x=>x!=null);
function ratioPct(x){x=num(x);if(x==null||!ratioVals.length)return null;return ratioVals.filter(z=>z<=x).length/ratioVals.length}

function model(){
 const W={commercial:CONFIG.wCommercial,activity:CONFIG.wActivity,coverage:CONFIG.wCoverage,customer:CONFIG.wCustomer,productivity:CONFIG.wProductivity,coaching:CONFIG.wCoaching,progress:CONFIG.wProgress};
 DATA.forEach(r=>{
 let commercial=avgA(['Total Ach.%','AM Ach.%','PM Ach.%'].map(k=>v(k,r))); commercial=commercial==null?null:Math.min(commercial,1.5)/1.5*100;
 let activity=avgA([pct('AM Call Rate',v('AM Call Rate',r)),pct('PM Call Rate',v('PM Call Rate',r))]); activity=activity==null?null:activity*100;
 let coverage=avgA([pct('AM Coverage',v('AM Coverage',r)),pct('AM PHD Coverage',v('AM PHD Coverage',r)),pct('PM Coverage',v('PM Coverage',r)),pct('PM Coverage by Frequency',v('PM Coverage by Frequency',r)),pct('Coverage of Served Customers',v('Coverage of Served Customers',r)),pct('GL Coverage',v('GL Coverage',r))]); coverage=coverage==null?null:coverage*100;
 let cq=[];let x=pct('Class A%',v('Class A%',r));if(x!=null)cq.push(x);x=pct('Class C%',v('Class C%',r),true);if(x!=null)cq.push(x);let ss=v('Standard Master File',r),aa=v('Actual Master File',r);if(ss!=null&&ss>0&&aa!=null){x=ratioPct(aa/ss);if(x!=null)cq.push(x)}let customer=cq.length?avgA(cq)*100:null;
 let productivity=pct('ROI of Served Customers',v('ROI of Served Customers',r));productivity=productivity==null?null:productivity*100;
 let coaching=avgA([pct('Total Coaching Halves',v('Total Coaching Halves',r)),pct('Total Check Halves',v('Total Check Halves',r)),pct('Total Single Halves',v('Total Single Halves',r))]); coaching=coaching==null?null:coaching*100;
 let progress=pct('Q2 vs Q1 Progress',v('Q2 vs Q1 Progress',r)); progress=progress==null?null:progress*100;
 let dims={commercial,activity,coverage,customer,productivity,coaching,progress},score=0,weight=0;Object.keys(W).forEach(k=>{if(dims[k]!=null){score+=dims[k]*W[k];weight+=W[k]}});r['Performance Score']=weight?+(score/weight).toFixed(1):null;
 const inputs=['Total Ach.%','AM Ach.%','PM Ach.%','AM Call Rate','PM Call Rate','AM Coverage','AM PHD Coverage','PM Coverage','PM Coverage by Frequency','GL Coverage','Coverage of Served Customers','Class A%','Class C%','Standard Master File','Actual Master File','ROI of Served Customers','Total Coaching Halves','Total Check Halves','Total Single Halves','Q1 Ach.%','Q2 Ach.%','Q3 Ach.%','Q4 Ach.%','Q2 vs Q1 Progress'];r['Score Data Completeness']=inputs.filter(k=>v(k,r)!=null).length/inputs.length;
 let ach=v('Total Ach.%',r);r['Performance Classification']=ach==null?'Insufficient Data':ach<CONFIG.classCritical?'Critical Low Performer':ach<CONFIG.classLow?'Low Performer':ach<CONFIG.classNeeds?'Needs Improvement':ach<CONFIG.classStable?'Stable / Average':ach<CONFIG.classGood?'Good Performer':'High Performer';
})}
model();

function uniq(field, rows=DATA){
 return [...new Set(rows.map(r=>r[field]).filter(x=>x!=null&&x!==''))].sort((a,b)=>String(a).localeCompare(String(b)));
}
function getFilterValues(){
 return {bu:document.getElementById('bu').value,team:document.getElementById('team').value,dm:document.getElementById('dm').value,gov:document.getElementById('gov').value,tenure:document.getElementById('tenure').value};
}
const filterFields={bu:'Business Unite',team:'Team',dm:'DM Name',gov:'Governorate',tenure:'Tenure Group'};
const filterLabels={bu:'All Business Units',team:'All Teams',dm:'All DMs',gov:'All Governorates',tenure:'All Tenure Groups'};
function rowsForOptions(excludeId){
 const f=getFilterValues();
 return DATA.filter(r=>
  (excludeId==='bu'||!f.bu||r['Business Unite']===f.bu)&&
  (excludeId==='team'||!f.team||r.Team===f.team)&&
  (excludeId==='dm'||!f.dm||r['DM Name']===f.dm)&&
  (excludeId==='gov'||!f.gov||r.Governorate===f.gov)&&
  (excludeId==='tenure'||!f.tenure||r['Tenure Group']===f.tenure)
 );
}
function updateFilterOptions(){
 Object.entries(filterFields).forEach(([id,field])=>{
  const el=document.getElementById(id), current=el.value, values=uniq(field,rowsForOptions(id));
  el.innerHTML='<option value="">'+filterLabels[id]+'</option>';
  values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});
  el.value=values.includes(current)?current:'';
 });
}
['bu','team','dm','gov','tenure'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{updateFilterOptions();renderAll();}));
function filtered(){
 const f=getFilterValues();
 return DATA.filter(r=>(!f.bu||r['Business Unite']===f.bu)&&(!f.team||r.Team===f.team)&&(!f.dm||r['DM Name']===f.dm)&&(!f.gov||r.Governorate===f.gov)&&(!f.tenure||r['Tenure Group']===f.tenure));
}
function resetFilters(){['bu','team','dm','gov','tenure'].forEach(id=>document.getElementById(id).value='');updateFilterOptions();renderAll()}
function avg(a,f){let x=a.map(r=>num(r[f])).filter(v=>v!=null&&!Number.isNaN(v));return x.length?x.reduce((s,v)=>s+v,0)/x.length:null}
function sum(a,f){return a.reduce((s,r)=>s+(num(r[f])||0),0)}
function count(a,p){return a.filter(p).length}
function med(a,f){let x=a.map(r=>num(r[f])).filter(v=>v!=null).sort((a,b)=>a-b);if(!x.length)return null;let m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2}
function plot(id,data,layout={}){
 try{
  if(typeof Plotly==='undefined') return;
  Plotly.react(id,data,Object.assign({
   margin:{l:45,r:15,t:25,b:45},
   paper_bgcolor:'#fff',
   plot_bgcolor:'#fff',
   font:{family:'Segoe UI,Arial',size:11,color:'#344054'},
   legend:{orientation:'h'}
  },layout),{responsive:true,displayModeBar:false});
 }catch(e){
  const el=document.getElementById(id);
  if(el) el.innerHTML='<div class="insight">Chart unavailable, but the underlying analysis is still shown.</div>';
 }
}
function card(label,value,hint=''){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function badge(p){let c=p?.startsWith('P1')?'p1':p?.startsWith('P2')?'p2':p?.startsWith('P3')?'p3':'p4';return `<span class="badge ${c}">${esc(p)}</span>`}
function table(rows,cols){return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]?c[2](r[c[0]],r):esc(r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function addPage(id,title,body){document.getElementById('main').innerHTML+=`<section class="page" id="${id}"><h2>${title}</h2>${body}</section>`}

function buildShell(){
 document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button id="n${p[0]}" onclick="showPage('${p[0]}')">${i+1}. ${p[1]}</button>`).join('');
 pages.forEach(p=>document.getElementById('main').innerHTML+=`<section class="page" id="${p[0]}"><h2>${p[1]}</h2><div id="${p[0]}body"></div></section>`);
}
function showPage(id){pages.forEach(p=>{document.getElementById(p[0]).classList.toggle('active',p[0]===id);document.getElementById('n'+p[0]).classList.toggle('active',p[0]===id)});renderPage(id)}

/* ================= MONTHLY EXCEL LOADER ================= */
const MONTHLY_NUMERIC_FIELDS=[
 'AM Call Rate','AM Coverage','AM PHD Coverage','AM Coaching Halves','AM Sales Value','AM FCT Value','AM Ach.%',
 'PM Call Rate','PM Coverage','PM Coverage by Frequency','PM Coaching Halves','Standard Master File','Actual Master File','Class A%','Class C%','PM Sales Value','PM FCT Value','PM Ach.%',
 'Total Coaching Halves','Total Check Halves','Total Single Halves','GL Coverage','ROI of Served Customers','Coverage of Served Customers',
 'Total Sales Value','Total FCT Value','Total Ach.%',
 'Q1 Ach.%','Q2 Ach.%','Q3 Ach.%','Q4 Ach.%','Q2 vs Q1 Progress'
];

function parseExcelNumber(x){
 if(x===null||x===undefined||x==='') return null;
 if(typeof x==='number') return Number.isFinite(x)?x:null;
 let s=String(x).trim().replace(/,/g,'');
 if(!s) return null;
 let pct=false;
 if(s.endsWith('%')){pct=true;s=s.slice(0,-1);}
 let n=Number(s);
 if(!Number.isFinite(n)) return null;
 return pct?n/100:n;
}

function normalizeDateValue(x){
 if(x instanceof Date && !isNaN(x)) return x.toISOString().slice(0,10);
 if(typeof x==='number' && window.XLSX && XLSX.SSF){
   const d=XLSX.SSF.parse_date_code(x);
   if(d && d.y) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
 }
 if(x!=null && String(x).trim()) return String(x).trim();
 return '';
}

function canonKey(h){
 return String(h||'')
   .replace(/\u200B/g,'')          // strip zero-width space
   .trim()
   .replace(/[:\-–—]+$/,'')        // strip trailing colon/dash
   .trim()
   .replace(/\s+/g,' ')            // collapse internal double/multiple spaces
   .toLowerCase();
}
const HEADER_CANON_FIELDS=[
 'Business Unite','Team','DM Name','Hire Date','Governorate',
 'AM Call Rate','AM Coverage','AM PHD Coverage','AM Coaching Halves','AM Sales Value','AM FCT Value','AM Ach.%',
 'PM Call Rate','PM Coverage','PM Coverage by Frequency','PM Coaching Halves','Standard Master File','Actual Master File','Class A%','Class C%','PM Sales Value','PM FCT Value','PM Ach.%',
 'Total Coaching Halves','Total Check Halves','Total Single Halves','GL Coverage','ROI of Served Customers','Coverage of Served Customers',
 'Total Sales Value','Total FCT Value','Total Ach.%',
 'Q1 Ach.%','Q2 Ach.%','Q3 Ach.%','Q4 Ach.%','Q2 vs Q1 Progress'
];
const HEADER_EXTRA_ALIASES={
 'business unit':'Business Unite',
 'q1 ach':'Q1 Ach.%','q1 ach%':'Q1 Ach.%','q1 achievement':'Q1 Ach.%','q1 achievement%':'Q1 Ach.%','q1':'Q1 Ach.%',
 'q2 ach':'Q2 Ach.%','q2 acg':'Q2 Ach.%','q2 ach%':'Q2 Ach.%','q2 achievement':'Q2 Ach.%','q2 achievement%':'Q2 Ach.%','q2':'Q2 Ach.%',
 'q3 ach':'Q3 Ach.%','q3 ach%':'Q3 Ach.%','q3 achievement':'Q3 Ach.%','q3 achievement%':'Q3 Ach.%','q3':'Q3 Ach.%',
 'q4 ach':'Q4 Ach.%','q4 ach%':'Q4 Ach.%','q4 achievement':'Q4 Ach.%','q4 achievement%':'Q4 Ach.%','q4':'Q4 Ach.%',
 'q2 vs q1 progress':'Q2 vs Q1 Progress','q2vsq1 progress':'Q2 vs Q1 Progress','progress (q2 vs q1)':'Q2 vs Q1 Progress','progress':'Q2 vs Q1 Progress',
 'area':'Areas','area name':'Areas'
};
const HEADER_CANON_MAP={};
HEADER_CANON_FIELDS.forEach(f=>{ HEADER_CANON_MAP[canonKey(f)]=f; });
Object.keys(HEADER_EXTRA_ALIASES).forEach(k=>{ HEADER_CANON_MAP[canonKey(k)]=HEADER_EXTRA_ALIASES[k]; });
function normalizeHeader(h){
 const trimmed=String(h||'').replace(/\u200B/g,'').trim();
 const c=canonKey(trimmed);
 return HEADER_CANON_MAP[c]||trimmed;
}

function addBasicDerivedRows(rows){
 const now=new Date();
 rows.forEach(r=>{
   Object.keys(r).forEach(k=>r[k]=k==='Hire Date'?normalizeDateValue(r[k]):r[k]);

   MONTHLY_NUMERIC_FIELDS.forEach(k=>{
     if(k in r) r[k]=parseExcelNumber(r[k]);
   });

   if(r['AM Ach.%']==null && num(r['AM FCT Value'])>0)
     r['AM Ach.%']=num(r['AM Sales Value'])/num(r['AM FCT Value']);
   if(r['PM Ach.%']==null && num(r['PM FCT Value'])>0)
     r['PM Ach.%']=num(r['PM Sales Value'])/num(r['PM FCT Value']);
   if(r['Total Sales Value']==null)
     r['Total Sales Value']=(num(r['AM Sales Value'])||0)+(num(r['PM Sales Value'])||0);
   if(r['Total FCT Value']==null)
     r['Total FCT Value']=(num(r['AM FCT Value'])||0)+(num(r['PM FCT Value'])||0);
   if(r['Total Ach.%']==null && num(r['Total FCT Value'])>0)
     r['Total Ach.%']=num(r['Total Sales Value'])/num(r['Total FCT Value']);
   if(r['Total Coaching Halves']==null)
     r['Total Coaching Halves']=(num(r['AM Coaching Halves'])||0)+(num(r['PM Coaching Halves'])||0);
   if(r['Master File Gap']==null && num(r['Standard Master File'])!=null && num(r['Actual Master File'])!=null)
     r['Master File Gap']=num(r['Standard Master File'])-num(r['Actual Master File']);
   if(r['Q2 vs Q1 Progress']==null && num(r['Q1 Ach.%'])!=null && num(r['Q2 Ach.%'])!=null)
     r['Q2 vs Q1 Progress']=num(r['Q2 Ach.%'])-num(r['Q1 Ach.%']);

   if(r['Hire Date']){
     const d=new Date(r['Hire Date']);
     if(!isNaN(d)){
       const months=Math.max(0,(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth())-(now.getDate()<d.getDate()?1:0));
       r['Tenure Years']=+(months/12).toFixed(2);
       r['Tenure Group']=months<6?'New Hire':months<=18?'Early Tenure (6-18m)':months<=36?'Established (19-36m)':'Experienced (36m+)';
     }
   }
 });
}

function diagnoseMonthlyRows(rows){
 // Diagnostic rules using the available KPI evidence; every cutoff below is editable in Setup.
 rows.forEach(r=>{
   const gaps=[];
   const ach=num(r['Total Ach.%']);
   const aCall=num(r['AM Call Rate']), pCall=num(r['PM Call Rate']);
   const aCov=num(r['AM Coverage']), aPhd=num(r['AM PHD Coverage']), pCov=num(r['PM Coverage']);
   const freq=num(r['PM Coverage by Frequency']);
   const gl=num(r['GL Coverage']);
   const aClass=num(r['Class A%']), cClass=num(r['Class C%']);
   const roi=num(r['ROI of Served Customers']);
   const masterGap=num(r['Master File Gap']);
   const coaching=(num(r['Total Coaching Halves'])||0)+(num(r['Total Single Halves'])||0);

   if(aCall!=null && aCall<CONFIG.gapCallRateMin) gaps.push('Low AM call rate');
   if(pCall!=null && pCall<CONFIG.gapCallRateMin) gaps.push('Low PM call rate');
   if(aCov!=null && aCov<CONFIG.gapCoverageMin) gaps.push('Low AM coverage');
   if(aPhd!=null && aPhd<CONFIG.gapCoverageMin) gaps.push('Low AM PHD coverage');
   if(pCov!=null && pCov<CONFIG.gapCoverageMin) gaps.push('Low PM coverage');
   if(freq!=null && (freq<CONFIG.gapFreqMin || freq>CONFIG.gapFreqMax)) gaps.push('Frequency coverage gap');
   if(gl!=null && gl<CONFIG.gapCoverageMin) gaps.push('Low GL coverage');
   if(aClass!=null && aClass<CONFIG.gapClassAMin) gaps.push('Low Class A%');
   if(cClass!=null && cClass>CONFIG.gapClassCMax) gaps.push('High Class C%');
   if(masterGap!=null && masterGap>0) gaps.push('Master file gap');
   if(roi!=null && roi<CONFIG.gapROIMin) gaps.push('Low ROI');
   if(coaching!=null && coaching<CONFIG.gapMinCoachingHalves) gaps.push('Low coaching activity');

   r['KPI Gaps']=gaps.length;
   r['Main Gap']=gaps[0]||'No major gap';

   if(ach==null) r['Priority']='P4 – Monitor';
   else if(ach<CONFIG.priorityP1Ach && gaps.length>=CONFIG.priorityP1MinGaps) r['Priority']='P1 – Immediate Intervention';

   r['Potential']=(ach!=null && ach>=CONFIG.potentialMinAch && ach<CONFIG.potentialMaxAch && gaps.length>0)?'High Potential':'Normal';

   const actions={
     'Low AM call rate':"Review the DM's own AM call plan and account routing.",
     'Low PM call rate':"Review the DM's own PM call plan and doctor routing.",
     'Low AM coverage':'Improve AM account coverage against the planned customer universe.',
     'Low AM PHD coverage':'Review AM PHD/KOL account engagement and coverage plan.',
     'Low PM coverage':'Improve PM customer coverage and territory routing.',
     'Frequency coverage gap':'Review PM frequency plan and visit allocation.',
     'Low GL coverage':'Review GL account engagement and coverage plan.',
     'Low Class A%':'Review customer mix and increase high-value customer coverage.',
     'High Class C%':'Reduce low-value customer dependency and improve customer mix.',
     'Master file gap':'Review master file and add missing target customers.',
     'Low ROI':'Review served-customer productivity and customer mix.',
     'Low coaching activity':'Increase joint field coaching visits (check and single halves) with the team.'
   };
   r['Recommended Action']=actions[r['Main Gap']]||'Monitor KPI trend and validate root cause with the regional manager.';
 });
}

async function loadMonthlyExcel(input){
 const file=input.files && input.files[0];
 if(!file) return;
 const status=document.getElementById('fileStatus');
 status.textContent='Loading '+file.name+'…';
 status.style.color='#2563eb';

 try{
   if(typeof XLSX==='undefined') throw new Error('Excel reader library did not load. Please open the dashboard with internet access.');
   const buf=await file.arrayBuffer();
   const wb=XLSX.read(buf,{type:'array',cellDates:true});
   const sheetName=wb.SheetNames[0];
   const ws=wb.Sheets[sheetName];
   if(!ws) throw new Error('No worksheet found.');
   const raw=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
   if(!raw.length) throw new Error('The selected worksheet is empty.');

   const rows=raw.map(row=>{
     const o={};
     Object.entries(row).forEach(([k,v])=>o[normalizeHeader(k)]=v);
     return o;
   });

   const required=['DM Name','Team','Total Sales Value','Total FCT Value'];
   const missing=required.filter(k=>!rows.some(r=>Object.prototype.hasOwnProperty.call(r,k)));
   if(missing.length) throw new Error('Missing required columns: '+missing.join(', '));

   addBasicDerivedRows(rows);
   DATA=rows;
   diagnoseMonthlyRows(DATA);
   model();
   diagnoseMonthlyRows(DATA);

   ['bu','team','dm','gov','tenure'].forEach(id=>document.getElementById(id).value='');
   updateFilterOptions();
   renderAll();

   document.querySelector('header .sub').textContent=
     `District Manager performance | ${DATA.length} records | Loaded: ${file.name} | Monthly management view`;
   status.textContent=`Loaded: ${file.name} • ${DATA.length} DMs`;
   status.style.color='#16a34a';
 }catch(err){
   console.error(err);
   status.textContent='Load failed';
   status.style.color='#dc2626';
   alert('Could not load the Excel file.\\n\\n'+err.message);
 }
}

  const good=Number(document.getElementById('cfgGood').value)/100;
  if([critical,low,needs,stable,good].some(x=>!Number.isFinite(x))){ alert('Please enter valid numbers for all classification thresholds.'); return; }
  if(!(critical<low && low<needs && needs<stable && stable<good)){ alert('Classification thresholds must be in increasing order:\nCritical < Low < Needs Improvement < Stable < Good.'); return; }
  const wC=Number(document.getElementById('cfgWCommercial').value)/100;
  const wA=Number(document.getElementById('cfgWActivity').value)/100;
  const wCov=Number(document.getElementById('cfgWCoverage').value)/100;
  const wCu=Number(document.getElementById('cfgWCustomer').value)/100;
  const wP=Number(document.getElementById('cfgWProductivity').value)/100;
  const wCoach=Number(document.getElementById('cfgWCoaching').value)/100;
  const wProg=Number(document.getElementById('cfgWProgress').value)/100;
  if([wC,wA,wCov,wCu,wP,wCoach,wProg].some(x=>!Number.isFinite(x)||x<0)){ alert('Please enter valid non-negative numbers for all weights.'); return; }
  const p1Ach=Number(document.getElementById('cfgP1Ach').value)/100;
  const p1Gaps=Number(document.getElementById('cfgP1Gaps').value);
  const p2Ach=Number(document.getElementById('cfgP2Ach').value)/100;
  const potMin=Number(document.getElementById('cfgPotMin').value)/100;
  const potMax=Number(document.getElementById('cfgPotMax').value)/100;
  if([p1Ach,p2Ach,potMin,potMax].some(x=>!Number.isFinite(x))||!Number.isFinite(p1Gaps)||p1Gaps<0){ alert('Please enter valid numbers for the Priority and Potential thresholds.'); return; }
  if(!(p1Ach<p2Ach)){ alert('P1 threshold must be lower than the P2 threshold.'); return; }
  if(!(potMin<potMax)){ alert('Potential "from" must be lower than "up to".'); return; }
  const gapCall=Number(document.getElementById('cfgGapCall').value)/100;
  const gapCov=Number(document.getElementById('cfgGapCov').value)/100;
  const gapFreqMin=Number(document.getElementById('cfgGapFreqMin').value)/100;
  const gapFreqMax=Number(document.getElementById('cfgGapFreqMax').value)/100;
  const gapClassA=Number(document.getElementById('cfgGapClassA').value)/100;
  const gapClassC=Number(document.getElementById('cfgGapClassC').value)/100;
  const gapROI=Number(document.getElementById('cfgGapROI').value)/100;
  const gapCoaching=Number(document.getElementById('cfgGapCoaching').value);
  if([gapCall,gapCov,gapFreqMin,gapFreqMax,gapClassA,gapClassC,gapROI].some(x=>!Number.isFinite(x))||!Number.isFinite(gapCoaching)){ alert('Please enter valid numbers for all Gap Detection thresholds.'); return; }
  if(!(gapFreqMin<gapFreqMax)){ alert('Frequency band minimum must be lower than the maximum.'); return; }
  CONFIG.classCritical=critical; CONFIG.classLow=low; CONFIG.classNeeds=needs; CONFIG.classStable=stable; CONFIG.classGood=good;
  CONFIG.wCommercial=wC; CONFIG.wActivity=wA; CONFIG.wCoverage=wCov; CONFIG.wCustomer=wCu; CONFIG.wProductivity=wP; CONFIG.wCoaching=wCoach; CONFIG.wProgress=wProg;
  CONFIG.priorityP1Ach=p1Ach; CONFIG.priorityP1MinGaps=p1Gaps; CONFIG.priorityP2Ach=p2Ach;
  CONFIG.potentialMinAch=potMin; CONFIG.potentialMaxAch=potMax;
  CONFIG.gapCallRateMin=gapCall; CONFIG.gapCoverageMin=gapCov; CONFIG.gapFreqMin=gapFreqMin; CONFIG.gapFreqMax=gapFreqMax;
  CONFIG.gapClassAMin=gapClassA; CONFIG.gapClassCMax=gapClassC; CONFIG.gapROIMin=gapROI; CONFIG.gapMinCoachingHalves=gapCoaching;
  model();
  diagnoseMonthlyRows(DATA);
  renderAll();
  const status=document.getElementById('cfgStatus');
  if(status){ status.style.color='#16a34a'; status.textContent='Saved. Classification, Score, Priority, Potential and Gap Detection recalculated across the whole dashboard.'; }
 }catch(err){ console.error(err); alert('Could not save settings.\n\n'+err.message); }
}

function page14(a,b){
 const actions={
   'Low AM call rate':"Review the DM's own AM call plan and account routing.",
   'Low PM call rate':"Review the DM's own PM call plan and doctor routing.",
   'Low AM coverage':'Improve AM account coverage against the planned customer universe.',
   'Low AM PHD coverage':'Review AM PHD/KOL account engagement and coverage plan.',
   'Low PM coverage':'Improve PM customer coverage and territory routing.',
   'Frequency coverage gap':'Review PM frequency plan and visit allocation.',
   'Low GL coverage':'Review GL account engagement and coverage plan.',
   'Low Class A%':'Review customer mix and increase high-value customer coverage.',
   'High Class C%':'Reduce low-value customer dependency and improve customer mix.',
   'Master file gap':'Review master file and add missing target customers.',
   'Low ROI':'Review served-customer productivity and customer mix.',
   'Low coaching activity':'Increase joint field coaching visits (check and single halves) with the team.'
 };
 const FLAG_THRESHOLD=0.25;

 function topGap(rows){
  let counts={};
  rows.forEach(r=>{ let g=r['Main Gap']; if(g && g!=='No major gap') counts[g]=(counts[g]||0)+1; });
  let sorted=Object.entries(counts).sort((x,y)=>y[1]-x[1]);
  return sorted.length? sorted[0][0] : null;
 }
 function buildGroup(field){
  let names=[...new Set(a.map(r=>r[field]).filter(x=>x!=null&&x!==''))];
  return names.map(name=>{
   let rows=a.filter(r=>r[field]===name);
   let low=count(rows,r=>['Critical Low Performer','Low Performer'].includes(r['Performance Classification']));
   let critical=count(rows,r=>r['Performance Classification']==='Critical Low Performer');
   let lowPct=rows.length? low/rows.length : 0;
   let gap=topGap(rows);
   return {
    Name:name, DMs:rows.length, Ach:avg(rows,'Total Ach.%'), Low:low, LowPct:lowPct, Critical:critical,
    Progress:avg(rows,'Q2 vs Q1 Progress'),
    Coaching:avg(rows,'Total Coaching Halves'), Check:avg(rows,'Total Check Halves'), Single:avg(rows,'Total Single Halves'),
    Gap:gap||'No major gap', Flagged:lowPct>FLAG_THRESHOLD,
    Action: gap? (actions[gap]||'Monitor KPI trend and validate root cause with the regional manager.') : 'No dominant issue detected — continue standard monitoring.'
   };
  }).sort((x,y)=>y.LowPct-x.LowPct);
 }

 const clusterRows = buildGroup('Business Unite');
 const teamRows = buildGroup('Team');
 const govRows = buildGroup('Governorate');

 function renderGroupTable(rows,nameLabel){
  if(!rows.length) return '<div class="insight">No data available for the current selection.</div>';
  return `<div class="scroll"><table><thead><tr>
   <th>${nameLabel}</th><th>DMs</th><th>Avg Ach.</th><th>Low Performers</th><th>Low %</th><th>Critical</th><th>Avg Progress</th><th>Coaching</th><th>Check Halves</th><th>Single Halves</th><th>Top Gap</th><th>Status</th><th>Recommendation</th>
  </tr></thead><tbody>${rows.map(x=>`<tr>
   <td><b>${esc(x.Name)}</b></td>
   <td>${fmtN(x.DMs)}</td>
   <td>${fmtPct(x.Ach)}</td>
   <td>${fmtN(x.Low)}</td>
   <td>${fmtPct(x.LowPct)}</td>
   <td>${fmtN(x.Critical)}</td>
   <td>${fmtPct(x.Progress)}</td>
   <td>${fmtN(x.Coaching)}</td>
   <td>${fmtN(x.Check)}</td>
   <td>${fmtN(x.Single)}</td>
   <td>${esc(x.Gap)}</td>
   <td>${x.Flagged?'<span class="badge p1">Priority Attention</span>':'<span class="badge p4">Stable</span>'}</td>
   <td>${esc(x.Action)}</td>
  </tr>`).join('')}</tbody></table></div>`;
 }
 function renderTopIssues(rows,label){
  let flagged=rows.filter(x=>x.Flagged);
  if(!flagged.length) return `<div class="insight">No ${label} crosses the ${(FLAG_THRESHOLD*100).toFixed(0)}% low-performer flag in the current selection.</div>`;
  return flagged.slice(0,5).map(x=>`<div class="insight"><b>${esc(x.Name)}</b>: ${fmtPct(x.LowPct)} low performers across ${x.DMs} DMs (avg achievement ${fmtPct(x.Ach)}). Dominant issue: <b>${esc(x.Gap)}</b>. ${x.Critical?x.Critical+' critical performer(s) require immediate review. ':''}Recommended: ${esc(x.Action)}</div>`).join('');
 }

 b.innerHTML=`<div class="grid">
  ${card('Business Units',clusterRows.length)}
  ${card('Teams',teamRows.length)}
  ${card('Governorates',govRows.length)}
  ${card('Business Units Flagged',clusterRows.filter(x=>x.Flagged).length)}
  ${card('Teams Flagged',teamRows.filter(x=>x.Flagged).length)}
  ${card('Governorates Flagged',govRows.filter(x=>x.Flagged).length)}
 </div>
 <div class="insight">Flagged = more than ${(FLAG_THRESHOLD*100).toFixed(0)}% of DMs are Critical Low or Low Performer. "Top Gap" is the most frequently diagnosed KPI gap among that group's DMs.</div>

 <div class="panel"><h3>Business Unit — Big Issues &amp; Recommendations</h3><div id="p14buTop"></div><div style="margin-top:8px">${renderGroupTable(clusterRows,'Business Unit')}</div></div>
 <div class="panel"><h3>Team — Big Issues &amp; Recommendations</h3><div id="p14teamTop"></div><div style="margin-top:8px">${renderGroupTable(teamRows,'Team')}</div></div>
 <div class="panel"><h3>Governorate — Big Issues &amp; Recommendations</h3><div id="p14govTop"></div><div style="margin-top:8px">${renderGroupTable(govRows,'Governorate')}</div></div>`;

 document.getElementById('p14buTop').innerHTML=renderTopIssues(clusterRows,'Business Unit');
 document.getElementById('p14teamTop').innerHTML=renderTopIssues(teamRows,'Team');
 document.getElementById('p14govTop').innerHTML=renderTopIssues(govRows,'Governorate');
}

async function downloadStyledExport(exportRows,sheetName,fileName){
 if(typeof ExcelJS==='undefined') throw new Error('Excel export formatter did not load. Please open the dashboard with internet access.');
 const headers=Object.keys(exportRows[0]);
 const percentFields=new Set([
  'Total Ach.%','AM Ach.%','PM Ach.%','Q1 Ach%','Q2 Ach%','Q3 Ach%','Q4 Ach%',
  'Q1 Ach.%','Q2 Ach.%','Q3 Ach.%','Q4 Ach.%','Q2 vs Q1 Progress',
  'AM Call Rate','PM Call Rate','AM Coverage','AM PHD Coverage','PM Coverage',
  'PM Coverage by Frequency','GL Coverage','Coverage of Served Customers',
  'Class A%','Class C%','ROI of Served Customers'
 ]);
 const integerFields=new Set([
  'Total Coaching Halves','Total Check Halves','Total Single Halves',
  'Standard Master File','Actual Master File','Master File Gap','KPI Gaps'
 ]);
 const workbook=new ExcelJS.Workbook();
 const worksheet=workbook.addWorksheet(sheetName);
 worksheet.views=[{state:'frozen',ySplit:1}];
 worksheet.columns=headers.map(key=>{
  const longest=Math.max(key.length,...exportRows.map(row=>String(row[key]==null?'':row[key]).length));
  return {header:key,key,width:Math.min(36,Math.max(12,longest+2))};
 });
 worksheet.addRows(exportRows);
 worksheet.autoFilter={from:{row:1,column:1},to:{row:1,column:headers.length}};
 worksheet.getRow(1).height=32;
 worksheet.getRow(1).eachCell(cell=>{
  cell.font={bold:true,color:{argb:'FFFFFFFF'}};
  cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF14213D'}};
  cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
  cell.border={bottom:{style:'medium',color:{argb:'FF2563EB'}}};
 });
 worksheet.eachRow((row,rowNumber)=>{
  if(rowNumber===1) return;
  row.eachCell((cell,columnNumber)=>{
   const key=headers[columnNumber-1];
   if(percentFields.has(key)) cell.numFmt='0.0%';
   else if(integerFields.has(key)) cell.numFmt='#,##0';
   else if(typeof cell.value==='number') cell.numFmt='#,##0.##';
   cell.alignment={vertical:'middle',horizontal:typeof cell.value==='number'?'right':'left'};
  });
 });
 const buffer=await workbook.xlsx.writeBuffer();
 const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');
 link.href=url;
 link.download=fileName;
 document.body.appendChild(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
